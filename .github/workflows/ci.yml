name: CI

on:
  push:
    branches: [main, 'arena/**']
  pull_request:
    branches: [main]

jobs:
  test:
    name: Test / Lint / Python / E2E
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # --- Frontend: Node ---
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run lint

      # --- Python backend ---
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -e ".[testing]"
      - run: python -m pytest python/validation/ -v

      # --- Playwright E2E (browser) ---
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
