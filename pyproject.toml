[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "aether"
version = "3.0.0-alpha.1"
description = "Interactive Planetary Climate, Atmosphere, and Quantitative Habitability Explorer"
requires-python = ">=3.10"
dependencies = [
  "fastapi>=0.110.0",
  "uvicorn>=0.29.0",
  "pydantic>=2.6.0",
  "numpy>=1.26.0",
  # slowapi: canonical FastAPI/Starlette rate-limiting extension.
  # Source: https://pypi.org/project/slowapi/ (latest 0.1.10, released 2026-06).
  # Note: `scipy`, `xarray`, and `pint` were declared but are NOT imported anywhere
  # in python/; they were removed as unused dependencies.
  "slowapi>=0.1.9,<0.2",
]

# AETHER is a script/browser app: the Python modules are loaded via sys.path,
# not installed as a package. This empty-package config lets `pip install -e ".[testing]"`
# succeed (metadata + dependencies) without setuptools package auto-discovery failing.
[tool.setuptools]
packages = []

[project.optional-dependencies]
photochemistry = ["photochem"]
hpc = ["dask", "netcdf4"]
testing = [
  "pytest>=7.0",
  "pytest-asyncio>=0.23",
  "hypothesis>=6.0",
  "httpx>=0.25",
]

[tool.pytest]
testpaths = ["python/validation", "tests"]
asyncio_mode = "auto"
