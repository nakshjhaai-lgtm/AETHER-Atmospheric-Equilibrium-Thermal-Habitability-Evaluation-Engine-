[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "aether"
version = "3.0.0-alpha.1"
description = "Interactive Planetary Climate, Atmosphere, and Quantitative Habitability Explorer"
requires-python = ">=3.10"
dependencies = [
  "fastapi>=0.110.0",
  "uvicorn>=0.29.0",
  "pydantic>=2.6.0",
  "numpy>=1.26.0",
  "scipy>=1.12.0",
  "xarray>=2024.2.0",
  "pint>=0.23.0",
]

[project.optional-dependencies]
photochemistry = ["photochem"]
hpc = ["dask", "netcdf4"]
testing = [
  "pytest>=7.0",
  "pytest-asyncio>=0.23",
  "hypothesis>=6.0",
  "httpx>=0.25",
]

[tool.pytest]
testpaths = ["python/validation", "tests"]
asyncio_mode = "auto"
